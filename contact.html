    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"

      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"

    />

    <style>
      .bd-placeholder-img {
        font-size: 1.125rem;
        text-anchor: middle;
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }

      @media (min-width: 768px) {
        .bd-placeholder-img-lg {
          font-size: 3.5rem;
        }
      }
    </style>

    <link href="css/style.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
  </head>

  <body class="d-flex h-100 text-center text-white bg-dark">
    <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
      <header class="mb-auto">
        <div>
          <h3 class="float-md-start mb-0">Contact</h3>
          <nav class="nav nav-masthead justify-content-center float-md-end">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="birdhouse.html">Birdhouse</a>
            <a class="nav-link active" aria-current="page" href="contact.html"
              >Contact</a
            >
          </nav>
        </div>
      </header>

      <!-- Contact Form Section -->
      <section class="container my-5">
        <h1 class="text-center mb-4">Contact Me</h1>
        <p class="text-center text-muted">
          Feel free to reach out if you have questions, feedback, or just want
          to connect!
        </p>

        <div class="row justify-content-center">
          <div class="col-md-6">
            <form id="contact-form">
              <div class="mb-3">
                <label for="name" class="form-label">Your Name</label>
                <input type="text" class="form-control" id="name" required />
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Your Email</label>
                <input type="email" class="form-control" id="email" required />
              </div>

              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea
                  class="form-control"
                  id="message"
                  rows="4"
                  required
                ></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Send Message
              </button>
            </form>

            <!-- Feedback Message -->
            <p id="form-feedback" class="text-center mt-3 text-success"></p>
          </div>
        </div>
      </section>

      <script type="module" src="./js/contact.js"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

      <footer class="mt-auto text-white-50">
        <p>Muchen's Homepage 2025</p>
      </footer>
    </div>
  </body>
